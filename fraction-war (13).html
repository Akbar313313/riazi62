<style>
:root{--bg:#0a1330;--bg2:#13235a;--cy:#22e6ff;--or:#ff9f1c;--gr:#3dff9a;--rd:#ff3b5c;--pk:#c77dff;--tx:#eef4ff}
*{box-sizing:border-box;margin:0}
body{font-family:Tahoma,"Vazirmatn",Arial,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(circle at 20% 0,#27409a 0,transparent 45%),radial-gradient(circle at 90% 100%,#5a1d7a 0,transparent 40%),linear-gradient(var(--bg),var(--bg2));background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.scr{display:none;max-width:1000px;margin:0 auto;padding:16px;position:relative}.scr.on{display:block}
.card{background:linear-gradient(145deg,#1a2c6e,#101c4d);border:2px solid #3b5bd6;border-radius:22px;padding:22px;box-shadow:0 10px 40px #0008,inset 0 0 30px #22e6ff12}
h1{font-size:clamp(32px,6vw,58px);text-align:center;background:linear-gradient(90deg,var(--cy),var(--gr),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
h2{color:var(--or);margin-bottom:10px}
.sub{text-align:center;opacity:.85;margin-bottom:16px}
input{width:100%;padding:14px;margin:8px 0;border-radius:14px;border:2px solid #3b5bd6;background:#0a1236;color:#fff;font:inherit;font-size:18px}
.btn{display:block;width:100%;margin-top:14px;padding:14px;font:inherit;font-size:19px;font-weight:bold;color:#042;background:linear-gradient(var(--gr),#16c46e);border:0;border-radius:16px;cursor:pointer;box-shadow:0 6px 0 #0a7a43;transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0a7a43}
.btn.or{background:linear-gradient(#ffc04d,var(--or));box-shadow:0 6px 0 #b36b00;color:#321}
.warn{background:#ff3b5c22;border:1px dashed var(--rd);border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pill{background:#0a1236cc;border:2px solid #3b5bd6;border-radius:30px;padding:6px 14px;font-weight:bold}
#clock{color:var(--or);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
#ann{display:none;background:var(--pk);color:#210a35;padding:8px;border-radius:12px;margin-bottom:10px;text-align:center;font-weight:bold}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;line-height:1.1;font-weight:bold}
.fr i{font-style:normal;padding:0 6px}.fr i:first-child{border-bottom:3px solid currentColor}.fr u{display:none}
.bar{display:inline-flex;direction:ltr;border:3px solid #fff;border-radius:6px;overflow:hidden;margin:6px 4px}
.bar b{width:30px;height:26px;border-left:2px solid #0a1236;background:#0a1236}.bar b.f{background:linear-gradient(var(--cy),#0a8fd6)}
.grid{display:inline-grid;direction:ltr;border:3px solid #fff;margin:6px}
.grid b{width:26px;height:26px;border:1px solid #0a1236;background:#0a1236}.grid b.c{background:var(--cy)}.grid b.r{background:var(--or)}.grid b.x{background:var(--gr);box-shadow:inset 0 0 8px #fff}
.lesson p{margin:10px 0;line-height:2;font-size:18px}
.box{background:#0a1236aa;border-right:6px solid var(--gr);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:20px}
.vis{text-align:center}
/* ARENA */
#arena{position:relative;height:min(78vh,640px);border-radius:22px;overflow:hidden;border:3px solid #3b5bd6;cursor:none;touch-action:none;background:linear-gradient(#1c0b3a,#3a1457 55%,#0e2a55);user-select:none}
#arena::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,#0b1a3d 0 60px,#0f2250 60px 120px);clip-path:polygon(0 40%,10% 20%,25% 35%,40% 10%,55% 30%,70% 15%,85% 35%,100% 20%,100% 100%,0 100%)}
#qp{position:absolute;top:8px;left:8px;right:8px;text-align:center;background:#050c26dd;border:2px solid var(--cy);border-radius:16px;padding:8px;z-index:3}
#qtxt{font-size:clamp(20px,4vw,34px);direction:rtl}
#tgs{position:absolute;left:0;right:0;top:34%;display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;padding:0 8px;z-index:2}
.tg{width:clamp(120px,21%,190px);text-align:center;animation:sway 2.6s ease-in-out infinite alternate;animation-delay:var(--d)}
.tg .bot{font-size:clamp(46px,9vw,80px);filter:drop-shadow(0 6px 8px #000a)}
.tg .lab{background:#050c26;border:3px solid var(--or);border-radius:14px;padding:6px 4px;font-size:clamp(18px,3.4vw,30px);margin-top:-6px}
@keyframes sway{from{transform:translate(-16px,0)}to{transform:translate(16px,-14px)}}
.tg.hit{animation:boom .6s forwards}.tg.burn{animation:burn .9s forwards}.tg.cor .lab{border-color:var(--gr);box-shadow:0 0 18px var(--gr)}
@keyframes boom{50%{transform:scale(1.5);filter:brightness(3)}to{transform:scale(0);opacity:0}}
@keyframes burn{0%,50%{filter:sepia(1) saturate(8) hue-rotate(-30deg)}to{transform:translateY(30px) scale(.6);opacity:.2;filter:grayscale(1) brightness(.2)}}
#gw{transform-origin:50% 62%;position:absolute;bottom:-4px;left:50%;width:min(400px,60vw);margin-left:calc(min(400px,60vw)/-2);z-index:4;pointer-events:none}
#gw.go{animation:runin 2.6s linear}
@keyframes runin{0%{transform:translateX(-95vw) translateY(0) rotate(0deg) scaleY(1)}40%{transform:translateX(-45vw) translateY(0) rotate(0deg) scaleY(.88)}50%{transform:translateX(-38vw) translateY(-6px) rotate(0deg) scaleY(.82)}62%{transform:translateX(-26vw) translateY(-95px) rotate(-180deg) scaleY(1)}74%{transform:translateX(-12vw) translateY(-20px) rotate(-360deg) scaleY(1)}80%{transform:translateX(-8vw) translateY(0) rotate(-360deg) scaleY(.76)}90%{transform:translateX(-2vw) translateY(0) rotate(-360deg) scaleY(.84)}100%{transform:translateX(0) translateY(0) rotate(-360deg) scaleY(1)}}
#gun{display:block;width:100%;overflow:visible;transform:scaleX(var(--f,1));filter:drop-shadow(0 0 10px #000)}
#gun.rn{animation:bob .22s infinite alternate}@keyframes bob{to{margin-top:-9px}}
.lg{transform-box:fill-box;transform-origin:50% 0}#gun.rn .la{animation:lgs .22s linear infinite alternate}#gun.rn .lb{animation:lgs .22s linear infinite alternate-reverse}@keyframes lgs{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
#cv{transform:translateY(120px);transition:transform .45s}#gun.cov #cv{transform:none}
#nmt{position:absolute;left:40%;top:55%;width:20%;background:#eef2fa;color:#111;border:2px solid #111;border-radius:5px;font-weight:bold;font-size:clamp(8px,1.7vw,14px);text-align:center;padding:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 0 0 2px #ffc04d}
#lz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;display:none}
.tg.lk .lab{border-color:var(--rd);box-shadow:0 0 22px var(--rd)}
#gun.rc{animation:rc .15s}@keyframes rc{50%{transform:translate(-4px,7px) scaleX(var(--f,1))}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0}
.hole{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(#000,#000 40%,#ffd24d 41%,transparent 70%);z-index:4;animation:fade 2s forwards;pointer-events:none}
@keyframes fade{to{opacity:0}}
#xh{position:fixed;width:46px;height:46px;margin:-23px;border:2px solid var(--rd);border-radius:50%;pointer-events:none;z-index:99;display:none}
#xh::before,#xh::after{content:"";position:absolute;background:var(--rd)}#xh::before{left:50%;top:-8px;bottom:-8px;width:2px}#xh::after{top:50%;left:-8px;right:-8px;height:2px}
body.ing #xh{display:block}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#hg{height:70px;width:42px}
@keyframes pulse{50%{transform:scale(1.15);color:var(--rd)}}.lowt{animation:pulse .5s infinite}
.stars{font-size:50px;text-align:center}
#lock{position:fixed;inset:0;background:#000d;z-index:200;display:none;align-items:center;justify-content:center;text-align:center;font-size:26px;padding:20px}
/* teacher */
#tb{position:fixed;bottom:8px;left:8px;z-index:150;background:#0008;border:1px solid #fff4;color:#fff;border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:20px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{padding:8px 14px;border-radius:12px;border:2px solid #3b5bd6;background:#13235a;color:#fff;font:inherit;cursor:pointer}.tabs button.on{background:var(--cy);color:#012}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #fff2;padding:6px;text-align:center}th{color:var(--or)}
.kp{display:flex;gap:10px;flex-wrap:wrap}.kp div{flex:1;min-width:120px;background:#13235a;border-radius:14px;padding:12px;text-align:center}.kp b{display:block;font-size:28px;color:var(--gr)}
.ch{display:flex;align-items:flex-end;gap:14px;height:160px;margin:12px 0;direction:ltr}.ch div{flex:1;background:linear-gradient(var(--cy),#0a52d6);border-radius:8px 8px 0 0;text-align:center;font-size:13px;position:relative;min-height:4px}
.sm{padding:8px 12px;border-radius:10px;border:0;background:var(--or);font:inherit;cursor:pointer;margin:3px}
video{width:100%;max-width:420px;border-radius:14px;background:#000}
.bl{position:absolute;left:0;top:0;width:10px;height:28px;margin:-14px 0 0 -5px;border-radius:5px 5px 50% 50%;background:linear-gradient(#fff,#ffd24d 40%,#ff7a00);box-shadow:0 0 14px 4px #ffb347,0 26px 22px 6px #ff7a0088;z-index:6;pointer-events:none}
#arena.sm::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 140px 30px #000d;pointer-events:none;z-index:5}
#scam{position:fixed;right:8px;bottom:8px;width:54px;z-index:140;display:none;border:2px solid var(--cy);border-radius:12px;overflow:hidden;background:#000}#scam video{width:100%;display:block;transform:scaleX(-1)}#smic{height:6px;background:#0a1236}#smic i{display:block;height:100%;width:0;background:var(--gr)}
@media(max-width:600px){#gw{bottom:0}.tg .bot{font-size:44px}}

function hash(j){let h=7;for(const c of j+'mg-salt')h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36)}
function mkCode(){const rr=(J('mg_res')||[]).filter(x=>x.c==st.code),j=JSON.stringify({n:st.name,c:st.code,r:rr.map(x=>[x.s,x.ok,x.bad,x.l,x.sc,x.w?1:0,x.lv||0,x.ts]),w:rr.flatMap(x=>x.wl).slice(0,12)});return 'MG1-'+btoa(String.fromCharCode(...new TextEncoder().encode(j)))+'-'+hash(j)}
function cpy(){const t=$('#rc');t.select();try{navigator.clipboard.writeText(t.value).then(()=>alert('رمزینه کپی شد ✅'),()=>{document.execCommand('copy');alert('کپی شد ✅')})}catch(e){document.execCommand('copy');alert('کپی شد ✅')}}
async function vfile(code){const r=await getRecs(code);if(!r.length)return null;const m={};r.forEach(x=>(m[x.ss]=m[x.ss]||[]).push(x));const k=Object.keys(m).sort((a,b)=>m[b].length-m[a].length)[0];const t=m[k][0].m||'video/webm';return new File(m[k].sort((a,b)=>a.q-b.q).map(x=>x.b),'video-'+code+(/mp4/.test(t)?'.mp4':'.webm'),{type:t})}
async function dlv(){const f=await vfile(st.code);if(!f)return alert('فیلمی پیدا نشد');const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=st.name.replace(/\s+/g,'_')+'-'+st.code+'.'+f.name.split('.').pop();a.click()}
async function sendT(){const f=await vfile(st.code),t=$('#rc').value;try{if(f&&navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f],text:t});if(navigator.share)return await navigator.share({text:t})}catch(e){return}cpy();alert('رمزینه کپی شد. آن را همراه فیلم ذخیره‌شده برای معلم بفرست.')}
function parseCodes(v){const o=[];(v.match(/MG1-[A-Za-z0-9+\/=]+-[a-z0-9]+/g)||[]).forEach(c=>{const p=c.split('-');try{const j=new TextDecoder().decode(Uint8Array.from(atob(p[1]),x=>x.charCodeAt(0)));if(hash(j)===p[2])o.push(JSON.parse(j))}catch(e){}});return o}
const tot=(d,k)=>d.r.reduce((a,x)=>a+x[k],0);
async function find(){const v=$('#qc').value.trim(),o=$('#qr');let L=parseCodes(v);
if(!L.length){const q=v.replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x)),stu=(J('mg_stu')||[]).find(x=>x.code==q||x.name==q);if(!stu)return o.innerHTML='<p>❌ رمزینهٔ معتبری پیدا نشد. رمزینه‌ها را کامل Paste کن (هر کدام در یک خط).</p>';const rr=(J('mg_res')||[]).filter(x=>x.c==stu.code);L=[{n:stu.name,c:stu.code,loc:1,r:rr.map(x=>[x.s,x.ok,x.bad,x.l,x.sc,x.w?1:0,x.lv||0,x.ts]),w:rr.flatMap(x=>x.wl)}]}
window.CL=L;lst();if(L.length==1)one(0)}
function lst(){const L=window.CL;$('#qr').innerHTML=`<h2 style="margin-top:12px">👥 فهرست دانش‌آموزان (${fa(L.length)} نفر)</h2><div style="overflow-x:auto"><table><tr><th>#</th><th>نام و نام خانوادگی</th><th>کد</th><th>مرحله</th><th>درست</th><th>غلط</th><th>نمرهٔ کل</th><th>خروج از صفحه</th><th></th></tr>${L.map((d,i)=>`<tr><td>${fa(i+1)}</td><td>${d.n}</td><td>${fa(d.c)}</td><td>${fa(d.r.length)}</td><td>${fa(tot(d,1))}</td><td>${fa(tot(d,2))}</td><td><b>${fa(tot(d,4))}</b></td><td>${fa(tot(d,6))}</td><td><button class=sm onclick="one(${i})">جزئیات</button></td></tr>`).join('')}</table></div><button class=sm onclick="csvAll()">⬇️ خروجی کلی (Excel)</button><button class=sm onclick="saveAll()">💾 ذخیره همه در تحلیل‌ها</button><button class=sm onclick="CL.sort((a,b)=>tot(b,4)-tot(a,4));lst()">🏅 مرتب‌سازی بر اساس نمره</button><button class=sm onclick="window.print()">🖨️ چاپ</button><div id=qd></div>`}
async function one(i){const d=window.CL[i],rc=d.loc?await getRecs(d.c):[],ss=[...new Set(rc.map(x=>x.ss))];$('#qd').innerHTML=`<h2 style="margin-top:12px">👤 ${d.n} | 🆔 ${fa(d.c)}</h2><div class=kp><div>نمرهٔ کل<b>${fa(tot(d,4))}</b></div><div>درست<b>${fa(tot(d,1))}</b></div><div>غلط<b>${fa(tot(d,2))}</b></div><div>خروج از صفحه<b>${fa(tot(d,6))}</b></div></div><table><tr><th>مرحله</th><th>درست</th><th>غلط</th><th>جان</th><th>امتیاز</th><th>نتیجه</th></tr>${d.r.map(x=>`<tr><td>${NAMES[x[0]-1]}</td><td>${fa(x[1])}</td><td>${fa(x[2])}</td><td>${fa(x[3])}</td><td>${fa(x[4])}</td><td>${x[5]?'✅':'❌'}</td></tr>`).join('')||'<tr><td colspan=6>هنوز مرحله‌ای ثبت نشده</td></tr>'}</table>${d.w.length?`<h2 style="margin-top:12px">سؤال‌های غلط</h2>${d.w.map(x=>`<p>• ${x}</p>`).join('')}`:''}${ss.map((x,k)=>`<button class=sm onclick="pl('${d.c}',${x})">▶ فیلم ${fa(k+1)}</button><button class=sm onclick="pl('${d.c}',${x},1)">⬇️</button>`).join('')}`}
function csvAll(){const L=window.CL||[],t='\ufeffردیف,نام و نام خانوادگی,کد,مراحل,درست,غلط,نمره کل,خروج از صفحه,نمره م۱,نمره م۲,نمره م۳,نمره م۴,نمره م۵\n'+L.map((d,i)=>[i+1,'"'+d.n+'"',d.c,d.r.length,tot(d,1),tot(d,2),tot(d,4),tot(d,6),...[1,2,3,4,5].map(m=>d.r.filter(x=>x[0]==m).reduce((a,x)=>a+x[4],0))].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='class-results.csv';a.click()}
function saveCD(d){const u=J('mg_stu')||[];if(!u.find(x=>x.code==d.c))u.push({code:d.c,name:d.n,ts:Date.now()});W('mg_stu',u);const r=J('mg_res')||[];d.r.forEach((x,i)=>{if(!r.find(y=>y.c==d.c&&y.ts==x[7]))r.push({n:d.n,c:d.c,s:x[0],ok:x[1],bad:x[2],l:x[3],sc:x[4],w:!!x[5],lv:x[6],ts:x[7],wl:i?[]:d.w})});W('mg_res',r)}
function saveAll(){(window.CL||[]).forEach(saveCD);alert('همه ذخیره شدند؛ در تب «تحلیل نتایج» و «دانش‌آموزان» دیده می‌شوند.')}
/* ---------- 12h clock ---------- */
setInterval(()=>{const d=J('mg_dl');if(!d)return;const l=d-Date.now();$('#lock').style.display=l<=0&&st?'flex':'none';const x=Math.max(l,0),p=n=>String(n).padStart(2,'0'),t=fa(p(Math.floor(x/36e5))+':'+p(Math.floor(x/6e4)%60)+':'+p(Math.floor(x/1e3)%60));$('#clock').textContent=$('#clock2').textContent=t},1000);
if(st){if(!st.code){st.code=uc();reg();W('mg_st',st)}if(st.busy){const r=J('mg_res')||[];r.push({n:st.name,s:st.stage+1,ok:0,bad:0,l:0,w:false,sc:0,wl:['ترک مرحله (بستن صفحه)'],ts:Date.now(),c:st.code});W('mg_res',r);st.busy=0;st.stage++;W('mg_st',st)}lesson()}
/* ---------- teacher panel ---------- */
let ms,rec,chunks=[];
function openT(){const p=prompt('رمز پنل معلم:');if(p===null)return;if(p!=='00800080')return alert('رمز اشتباه است');tab('a');$('#tp').style.display='block'}
function closeT(){stopM();$('#tp').style.display='none'}
function tab(t){const r=J('mg_res')||[];let h=`<div class=top><h2>👨‍🏫 پنل معلم</h2><button class=sm onclick="closeT()">✖ بستن</button></div><div class=tabs>${[['a','📊 تحلیل نتایج'],['s','👥 دانش‌آموزان'],['t','🧰 ابزارها'],['q','🔎 رمزینه‌ها و خروجی کلی']].map(x=>`<button class="${x[0]==t?'on':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div><div class=card>`;
const names=[...new Set(r.map(x=>x.n))];
if(t=='a'){const tot=r.reduce((a,x)=>a+x.ok+x.bad,0),ok=r.reduce((a,x)=>a+x.ok,0),acc=tot?Math.round(ok/tot*100):0,wins=r.filter(x=>x.w).length;
h+=`<div class=kp><div>دانش‌آموز<b>${fa(names.length)}</b></div><div>تلاش‌ها<b>${fa(r.length)}</b></div><div>دقت کل<b>${fa(acc)}٪</b></div><div>مرحله پاک‌شده<b>${fa(wins)}</b></div></div><h2 style="margin-top:14px">دقت هر مرحله</h2><div class=ch>${NAMES.map((n,i)=>{const z=r.filter(x=>x.s==i+1),o=z.reduce((a,x)=>a+x.ok,0),t2=z.reduce((a,x)=>a+x.ok+x.bad,0),p=t2?Math.round(o/t2*100):0;return`<div style="height:${Math.max(p,3)}%"><br>${fa(p)}٪<br><small style="position:absolute;bottom:-34px;left:0;right:0;font-size:11px">م${fa(i+1)}</small></div>`}).join('')}</div><br><br>`;
const c={};r.forEach(x=>x.wl.forEach(w=>c[w]=(c[w]||0)+1));const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6);
h+=`<h2>سؤال‌های پرغلط 🔥</h2>`+(top.length?`<table>${top.map(x=>`<tr><td>${x[0]}</td><td>${fa(x[1])} بار</td></tr>`).join('')}</table>`:'<p>هنوز داده‌ای نیست.</p>');
const weak=NAMES.map((n,i)=>{const z=r.filter(x=>x.s==i+1),o=z.reduce((a,x)=>a+x.ok,0),t2=z.reduce((a,x)=>a+x.ok+x.bad,0);return[n,t2?o/t2:2]}).sort((a,b)=>a[1]-b[1])[0];if(r.length)h+=`<div class=box>💡 پیشنهاد: مبحث «${weak[0]}» نیاز به تدریس مجدد دارد.</div>`}
if(t=='s'){h+=`<table><tr><th>نام</th><th>مرحله</th><th>درست</th><th>غلط</th><th>جان</th><th>امتیاز</th><th>نتیجه</th><th>تصویر</th></tr>${[...r].reverse().map(x=>`<tr><td>${x.n}</td><td>${fa(x.s)}</td><td>${fa(x.ok)}</td><td>${fa(x.bad)}</td><td>${fa(x.l)}</td><td>${fa(x.sc)}</td><td>${x.w?'✅':'❌'}</td><td>${x.img?`<img src="${x.img}" width=44 style="border-radius:8px">`:'-'}</td></tr>`).join('')}</table><h2 style="margin-top:14px">🏅 برترین‌ها</h2>${names.map(n=>[n,r.filter(x=>x.n==n).reduce((a,x)=>a+x.sc,0)]).sort((a,b)=>b[1]-a[1]).slice(0,5).map((x,i)=>`<p>${['🥇','🥈','🥉','4️⃣','5️⃣'][i]} ${x[0]} — ${fa(x[1])}</p>`).join('')}<button class=sm onclick="csv()">⬇️ خروجی CSV</button> <button class=sm onclick="window.print()">🖨️ چاپ</button> <button class=sm style="background:var(--rd)" onclick="if(confirm('همهٔ نتایج پاک شود؟')){W('mg_res',[]);tab('s')}">🗑️ پاک‌کردن</button>`}
if(t=='t'){h+=`<h2>🎲 انتخاب تصادفی دانش‌آموز</h2><button class=sm onclick="pick()">انتخاب کن</button>
<h2 style="margin-top:14px">📢 پیام برای دانش‌آموزان</h2><input id=am value="${J('mg_msg')||''}" placeholder="مثلاً: فردا آزمون داریم!"><button class=sm onclick="W('mg_msg',$('#am').value);alert('ثبت شد')">ثبت پیام</button>
<h2 style="margin-top:14px">⏱️ زمان‌سنج کلاس</h2><b id=cd style="font-size:34px">۰۰:۰۰</b><br><button class=sm onclick="cdn(60)">۱ دقیقه</button><button class=sm onclick="cdn(180)">۳ دقیقه</button><button class=sm onclick="cdn(300)">۵ دقیقه</button>
<h2 style="margin-top:14px">⚙️ تنظیمات بازی</h2><button class=sm onclick="ext();alert('۱۲ ساعت دیگر تمدید شد')">➕ تمدید ۱۲ ساعت</button><button class=sm onclick="W('mg_dl',Date.now()+12*3600e3);alert('شمارش ۱۲ ساعته از نو شروع شد')">🔄 شروع دوبارهٔ ۱۲ ساعت</button><button class=sm onclick="T=+prompt('زمان هر سؤال (ثانیه):',T)||90">⏳ زمان هر سؤال</button><button class=sm onclick="if(confirm('ورود دانش‌آموز فعلی ریست شود؟')){localStorage.removeItem('mg_st');location.reload()}">🚪 دانش‌آموز جدید</button>`}
if(t=='c'){h+=`<button class=sm onclick="cam()">📷 روشن کردن دوربین و میکروفن</button><button class=sm onclick="snap()">📸 عکس</button><button class=sm onclick="recd()">⏺️ ضبط / توقف</button><button class=sm onclick="stopM()">⏹ خاموش</button><br><br><video id=vid autoplay muted playsinline></video><p>🎤 سطح صدا:</p><div style="background:#0a1236;border-radius:8px;height:16px"><div id=lv style="height:100%;width:0;background:var(--gr);border-radius:8px"></div></div><p class=sub>تصاویر و ضبط‌ها فقط روی همین دستگاه ذخیره می‌شوند.</p>`}
if(t=='q')h+=`<h2>🔎 رمزینهٔ دانش‌آموزان را اینجا Paste کن (هر رمزینه در یک خط؛ چندتا هم می‌شود)</h2><textarea id=qc rows=6 placeholder="MG1-..." style="width:100%;padding:10px;border-radius:12px;background:#0a1236;color:#fff;direction:ltr"></textarea><button class=sm onclick="find()">نمایش فهرست و نمرات</button><div id=qr></div>`;
$('#tp').innerHTML=h+'</div>'}
function pick(){const n=[...new Set((J('mg_res')||[]).map(x=>x.n))];alert(n.length?'🎯 '+n[Math.floor(Math.random()*n.length)]:'هنوز دانش‌آموزی ثبت نشده')}
function cdn(s){clearInterval(window.cdt);const e=Date.now()+s*1e3;window.cdt=setInterval(()=>{const l=Math.max(0,Math.round((e-Date.now())/1e3));const el=$('#cd');if(el)el.textContent=fa(String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0'));if(!l){clearInterval(window.cdt);sWin()}},250)}
async function cam(){try{ms=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('#vid').srcObject=ms;const a=ac(),an=a.createAnalyser(),s=a.createMediaStreamSource(ms);s.connect(an);const d=new Uint8Array(an.frequencyBinCount);(function L(){if(!ms)return;an.getByteFrequencyData(d);const v=d.reduce((x,y)=>x+y,0)/d.length;const l=$('#lv');if(l)l.style.width=Math.min(100,v*2)+'%';requestAnimationFrame(L)})()}catch(e){alert('دسترسی به دوربین/میکروفن ممکن نشد. مرورگر را روی «اجازه» بگذارید. ('+e.name+')')}}
function stopM(){if(ms){ms.getTracks().forEach(t=>t.stop());ms=null}}
function snap(){const v=$('#vid');if(!ms)return alert('اول دوربین را روشن کن');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='photo.png';a.click()}
function recd(){if(!ms)return alert('اول دوربین را روشن کن');if(rec&&rec.state=='recording'){rec.stop();return}chunks=[];rec=new MediaRecorder(ms);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='record.webm';a.click()};rec.start();alert('ضبط شروع شد. برای توقف دوباره دکمه را بزن')}
function csv(){const r=J('mg_res')||[],t='\ufeffنام,مرحله,درست,غلط,جان,امتیاز,نتیجه\n'+r.map(x=>[x.n,x.s,x.ok,x.bad,x.l,x.sc,x.w?'قبول':'مردود'].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='results.csv';a.click()}
</script></body></html>
